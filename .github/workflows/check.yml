# The gate on every push and pull request. The end-to-end tests start a real pi with a scripted model (no API key),
# and the run test checks exit codes from zsh, so both are installed here.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pinned to commits, in the spirit of the 7-day install cooldown.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: sudo apt-get install -y zsh
      - run: npm install -g @earendil-works/pi-coding-agent@1.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
